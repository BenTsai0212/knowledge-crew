<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登入｜knowledge-crew v5 草稿</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="v4.css">
</head>
<body>
<header class="signin-top">
  <div class="brand" style="padding:0"><svg width="28" height="28" viewBox="0 0 48 48" aria-hidden="true"><rect x="1" y="1" width="46" height="46" rx="11" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/><path d="M17 12v24M17 25l12-10M17 25l12 10" stroke="var(--fg)" stroke-width="3.5" stroke-linecap="round" fill="none"/><circle cx="29" cy="35" r="3.5" fill="var(--primary)"/><circle cx="31" cy="14" r="4.5" fill="var(--mark)" stroke="var(--mark-text)" stroke-width="1.5"/></svg><span>Knowledge Kit</span><span class="muted hide-m" style="font-weight:400">/ 範例公司</span></div>
  <span class="badge badge--quiet">虛構資料</span>
  <span class="spacer"></span>
  <label class="sr-only" for="lang">語言</label>
  <select class="select" id="lang" style="width:auto;min-height:40px"><option>中文</option><option>English</option></select>
</header>
<main class="signin" id="main">
  <section class="signin__hero" aria-labelledby="hero-title">
    <h2 id="hero-title" style="font-size:30px;line-height:1.3">交辦給 <span style="white-space:nowrap">AI 員工</span>，<br>你來驗收。</h2>
    <p style="font-size:18px">做對越多，看得越少。</p>
    <ul class="points" aria-label="怎麼運作">
      <li><span class="pt__n">1</span>員工標出沒把握的地方</li>
      <li><span class="pt__n">2</span>系統另外檢查</li>
      <li><span class="pt__n">3</span>看多細，由你決定</li>
    </ul>
  </section>

  <form class="card signin__panel" onsubmit="return false" aria-labelledby="si-title">
    <h1 id="si-title" tabindex="-1">登入</h1>
    <fieldset class="stack-s"><legend class="label" style="margin-bottom:6px">選一個展示帳號</legend>
      <label class="choice"><input type="radio" name="acc"><span><strong>訪客</strong><br><span class="hint mono">guest@example.test</span></span></label>
      <label class="choice"><input type="radio" name="acc"><span><strong>一般員工</strong><br><span class="hint mono">staff@example.test</span></span></label>
      <label class="choice choice--on"><input type="radio" name="acc" checked><span><strong>主管</strong><br><span class="hint mono">manager@example.test</span></span></label>
    </fieldset>
    <div class="field"><label class="label" for="code">邀請碼</label><input class="input" id="code" autocomplete="off"></div>
    <button class="btn btn--primary" type="submit" style="width:100%;min-height:48px">登入</button>
    <button class="btn btn--ghost" type="button" style="width:100%">只用邀請碼（可以切換身分）</button>
  </form>
</main>

<script src="v4.js"></script>
</body>
</html>
