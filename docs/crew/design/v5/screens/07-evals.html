<div class="main">
<header class="topbar">
  <div class="brand"><svg width="26" height="26" viewBox="0 0 48 48" aria-hidden="true"><rect x="1" y="1" width="46" height="46" rx="11" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/><path d="M17 12v24M17 25l12-10M17 25l12 10" stroke="var(--fg)" stroke-width="3.5" stroke-linecap="round" fill="none"/><circle cx="29" cy="35" r="3.5" fill="var(--primary)"/><circle cx="31" cy="14" r="4.5" fill="var(--mark)" stroke="var(--mark-text)" stroke-width="1.5"/></svg><span>範例公司</span></div>
  <span class="badge badge--quiet">虛構資料</span>
  <span class="spacer"></span>
  <button class="btn btn--ghost btn--icon" type="button" aria-label="最近的變化，4 則"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg></button>
  <button class="avatar" type="button" style="border:0;cursor:pointer;width:36px;height:36px" data-open="identity" aria-label="身分：主管，切換身分與語言">主</button>
</header>
<main class="page" id="main">
<header class="page-head">
  <div class="page-head__row">
    <div class="page-head__title"><h1 tabindex="-1">評測台</h1><p class="lead">58 題・檢查回答品質</p></div>
    <div class="page-head__actions"><button class="btn btn--sm" type="button">下載 JSON</button><button class="btn btn--sm" type="button">下載品質報告</button></div>
  </div>
</header>

<div class="grid-2">
  <form class="card" onsubmit="return false" aria-labelledby="ev-set">
    <div class="card-head"><h2 id="ev-set">評測設定</h2></div>
    <div class="grid-2" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)">
      <fieldset class="card card--tight" style="background:var(--raised);border:0;gap:var(--s2)"><legend class="label" style="float:left;margin-bottom:6px">設定 A</legend>
        <div class="field" style="clear:both"><label class="hint" for="a-k">topK（1～20）</label><input class="input" id="a-k" value="5"></div>
        <div class="field"><label class="hint" for="a-s">minScore（0～1）</label><input class="input" id="a-s" value="0.1"></div></fieldset>
      <fieldset class="card card--tight" style="background:var(--raised);border:0;gap:var(--s2)"><legend class="label" style="float:left;margin-bottom:6px">設定 B</legend>
        <div class="field" style="clear:both"><label class="hint" for="b-k">topK</label><input class="input" id="b-k" value="5" disabled></div>
        <div class="field"><label class="hint" for="b-s">minScore</label><input class="input" id="b-s" value="0.1" disabled></div></fieldset>
    </div>
    <label class="check"><input type="checkbox">同時跑設定 B 來比較</label>
    <label class="check"><input type="checkbox">用模型評分（較慢）</label>
    <div class="inline" style="border-top:1px solid var(--border);padding-top:var(--s4)"><button class="btn btn--primary" type="submit">開始評測</button></div>
  </form>
  <div class="empty" style="align-self:start">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <strong>還沒有評測結果</strong>
    <span class="muted">按「開始評測」後顯示每題結果。</span>
  </div>
</div>

</main>
</div>
</div>

<div class="scrim" data-state="identity" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="id-title">
    <div class="inline"><h2 id="id-title" style="flex:1">身分與語言</h2><button class="btn btn--ghost btn--icon" type="button" data-close aria-label="關閉"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <p class="hint">切換後，只顯示那個身分看得到的資料。</p>
    <fieldset class="stack-s"><legend class="label" style="margin-bottom:6px">身分</legend>
      <label class="choice"><input type="radio" name="idr"><span><strong>訪客</strong><br><span class="hint">公開文件</span></span></label>
      <label class="choice"><input type="radio" name="idr"><span><strong>一般員工</strong><br><span class="hint">內部文件・可上傳</span></span></label>
      <label class="choice choice--on"><input type="radio" name="idr" checked><span><strong>主管</strong><br><span class="hint">機密文件・可驗收</span></span></label>
    </fieldset>
    <div class="field"><label class="label" for="lang">語言</label><select class="select" id="lang"><option>中文（台灣）</option><option>English</option></select></div>
    <div class="dialog__foot"><button class="btn" type="button" data-close>取消</button><button class="btn btn--primary" type="button" data-close>切換</button></div>
  </div>
</div>
